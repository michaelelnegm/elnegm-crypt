<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - ElnegmCrypt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/cyber-style.css" />
  <link rel="stylesheet" href="../css/neon-glow.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/terminal.css" />
  <link rel="stylesheet" href="../css/logo.css" />
  <link rel="stylesheet" href="../css/matrix-bg.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <canvas id="particles-canvas"></canvas>
  <div class="app-wrapper">
    <header class="header">
      <div class="logo">ElnegmCrypt</div>
      <nav class="nav-links">
        <a href="../index.html"><i class="fas fa-lock"></i> تشفير</a>
        <a href="../decrypt.html"><i class="fas fa-unlock"></i> فك</a>
        <a href="../history.html"><i class="fas fa-history"></i> سجل</a>
        <a href="../about.html"><i class="fas fa-info-circle"></i> عن</a>
        <a href="../methods.html"><i class="fas fa-cogs"></i> طرق</a>
        <a href="dashboard.html"><i class="fas fa-chart-line"></i> لوحة</a>
      </nav>
    </header>
    <section class="card">
      <div class="card-title"><i class="fas fa-chart-line"></i> لوحة التحكم</div>
      <div class="row" id="stats">
        <div class="col" style="border:1px solid #00FF4144;border-radius:20px;padding:1.5rem;text-align:center;">
          <h2 id="total-ops" style="color:#00FF41;font-family:Orbitron;">0</h2>
          <p>إجمالي العمليات</p>
        </div>
        <div class="col" style="border:1px solid #0AFFED44;border-radius:20px;padding:1.5rem;text-align:center;">
          <h2 id="encrypt-count" style="color:#0AFFED;font-family:Orbitron;">0</h2>
          <p>عمليات التشفير</p>
        </div>
        <div class="col" style="border:1px solid #FF005544;border-radius:20px;padding:1.5rem;text-align:center;">
          <h2 id="decrypt-count" style="color:#FF0055;font-family:Orbitron;">0</h2>
          <p>عمليات فك التشفير</p>
        </div>
      </div>
      <div style="margin-top:1.5rem;border-top:1px solid #00FF4133;padding-top:1.5rem;">
        <button id="refresh-stats" class="btn btn-secondary"><i class="fas fa-sync"></i> تحديث الإحصائيات</button>
        <button id="clear-all-history" class="btn btn-danger" style="margin-right:1rem;"><i class="fas fa-trash"></i> مسح الكل</button>
      </div>
    </section>
    <footer class="text-center" style="color:#555;padding:1rem 0;font-size:0.8rem;border-top:1px solid #00FF4122;margin-top:2rem;">
      <i class="fas fa-code"></i> ElnegmCrypt — تشفير سايبر بنك <i class="fas fa-shield-alt"></i>
    </footer>
  </div>
  <script src="../js/matrix-rain.js"></script>
  <script src="../js/particles.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/ui-effects.js"></script>
</body>
</html>
