<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فك التشفير - ElnegmCrypt</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cyber-style.css" />
  <link rel="stylesheet" href="css/neon-glow.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/logo.css" />
  <link rel="stylesheet" href="css/matrix-bg.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <canvas id="particles-canvas"></canvas>
  <div class="app-wrapper">
    <header class="header">
      <div class="logo">ElnegmCrypt</div>
      <nav class="nav-links">
        <a href="index.html"><i class="fas fa-lock"></i> تشفير</a>
        <a href="decrypt.html"><i class="fas fa-unlock"></i> فك</a>
        <a href="history.html"><i class="fas fa-history"></i> سجل</a>
        <a href="about.html"><i class="fas fa-info-circle"></i> عن</a>
        <a href="methods.html"><i class="fas fa-cogs"></i> طرق</a>
        <a href="admin/dashboard.html"><i class="fas fa-chart-line"></i> لوحة</a>
      </nav>
    </header>
    <section class="card">
      <div class="card-title"><i class="fas fa-unlock"></i> فك التشفير</div>
      <div class="row">
        <div class="col">
          <label>📩 النص المشفر</label>
          <textarea id="ciphertext" rows="4" placeholder="الصق النص المشفر هنا ..."></textarea>
        </div>
        <div class="col">
          <label>🔑 طريقة التشفير</label>
          <select id="method-decrypt">
            <option value="base64">Base64</option>
            <option value="caesar">قيصر (إزاحة 3)</option>
            <option value="reverse">عكس النص</option>
            <option value="binary">ثنائي</option>
          </select>
          <button id="decrypt-btn" class="btn btn-secondary mt-1"><i class="fas fa-arrow-left"></i> فك</button>
        </div>
      </div>
      <div class="mt-2">
        <label>📄 النص الأصلي</label>
        <div class="output-box terminal" id="decrypted-output">...</div>
        <div class="flex-between mt-1">
          <button class="btn" id="copy-decrypted"><i class="fas fa-copy"></i> نسخ</button>
          <span class="badge"><i class="fas fa-check-circle"></i> فك</span>
        </div>
      </div>
    </section>
    <footer class="text-center" style="color:#555;padding:1rem 0;font-size:0.8rem;border-top:1px solid #00FF4122;margin-top:2rem;">
      <i class="fas fa-code"></i> ElnegmCrypt — تشفير سايبر بنك <i class="fas fa-shield-alt"></i>
    </footer>
  </div>
  <script src="js/matrix-rain.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/encryption.js"></script>
  <script src="js/decryption.js"></script>
  <script src="js/clipboard.js"></script>
  <script src="js/history.js"></script>
  <script src="js/ui-effects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
